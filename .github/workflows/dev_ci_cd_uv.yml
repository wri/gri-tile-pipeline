name: Run Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install UV
      - name: Install UV
        uses: astral-sh/setup-uv@v6

      # Step 3: Install dependencies
      - name: Sync dependencies
        env:
          KENNC_REPO_PAT: ${{ secrets.KENNC_REPO_PAT }}
        run: |
          git config --global url."https://${KENNC_REPO_PAT}@github.com/".insteadOf "https://github.com/"
          uv sync --locked --all-extras --dev

      # Step 4: Install Linux dependencies (GDAL)
      # - Disable man-db trigger (rebuilds man pages after every install; slow and useless in CI)
      # - Use --no-install-recommends to skip optional GDAL plugins we don't need
      # - Cache .deb files across runs so we don't re-download on every PR
      - name: Install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: gdal-bin libgdal-dev
          version: 1.0
          execute_install_scripts: true

      # Step 4b: Verify GDAL actually installed.
      # cache-apt-pkgs-action can silently cache a failed/empty install (e.g.
      # apt mirror desync) as if it succeeded, which then surfaces as
      # confusing failures in unrelated tests instead of here. Self-heal with
      # a direct apt-get install/retry (a fresh `apt-get update` often picks
      # a different mirror replica), and fail loudly if GDAL still isn't usable.
      - name: Verify GDAL CLI tools
        run: |
          for attempt in 1 2 3; do
            if command -v gdalbuildvrt >/dev/null 2>&1; then
              gdalbuildvrt --version
              exit 0
            fi
            echo "gdalbuildvrt not found (attempt $attempt/3); installing directly"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev
          done
          command -v gdalbuildvrt

      # Step 5: Run tests
      # The ard-file=exclude setting ensures that the tests which require ARD tiles are not executed.
      - name: Run Tests
        run: |
          if [ -f "secrets.yaml" ]; then
            echo "Aborting tests to avoid unintended execution.."
            exit 1
          fi
          uv run pytest tests/ --ard-file exclude