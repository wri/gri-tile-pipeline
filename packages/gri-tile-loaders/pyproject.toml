[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gri-tile-loaders"
version = "0.1.0"
description = "Tile data loaders for the GRI TTC pipeline (STAC, Planetary Computer, raster I/O)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pystac-client>=0.7",
    "odc-stac>=0.3",
    "boto3>=1.28",
    "pyproj>=3.6",
    "shapely>=2.0",
    "planetary-computer>=1.0",
    "requests>=2.28",
    "hickle>=5.0",
    "rasterio>=1.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gri_tile_loaders"]

[tool.hatch.build.targets.sdist]
include = [
    "src/gri_tile_loaders",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -ra"