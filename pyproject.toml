[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gri-tile-pipeline"
version = "0.1.0"
description = "GRI TTC tile pipeline: ingest, download, predict, stats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "pandas>=2.0",
    "duckdb>=1.5.1",
    "obstore>=0.3",
    "lithops==3.6.1",
    "requests>=2.33.0",
    "cryptography>=46.0.7",
    "Pygments>=2.20.0",
    "idna>=3.15", # added to resolve: https://github.com/wri/gri-tile-pipeline/security/dependabot/12
    "urllib3>=2.7.0", # added to resolve: https://github.com/wri/gri-tile-pipeline/security/dependabot/10
    "gri-shared-library",
]

[project.optional-dependencies]
loaders = [
    "gri-tile-loaders",
]
predict = [
    "tensorflow>=2.16",
    "scipy>=1.11",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "hickle>=5.0",
    "rasterio>=1.3",
    "bottleneck>=1.3",
    "numpy>=1.26",
    "pillow>=12.2.0",
    "werkzeug>=3.1.6",
]
zonal = [
    "exactextract>=0.2",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "rasterstats>=0.19",
    "fiona>=1.9",
    "scipy>=1.11",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "matplotlib>=3.10.8",
]
all = [
    "gri-tile-pipeline[loaders,predict,zonal,dev]",
]

[project.scripts]
gri-ttc = "gri_tile_pipeline.cli:gri_ttc"

# Ship the gri_tile_pipeline package AND the loose lithops_workers.py module.
# lithops_workers must stay a top-level module so Lithops can pickle/unpickle
# workers on Lambda without needing gri_tile_pipeline installed there.
[tool.hatch.build.targets.wheel]
packages = ["src/gri_tile_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"src/lithops_workers.py" = "lithops_workers.py"
"models" = "gri_tile_pipeline/models"

# uv workspace: gri-tile-loaders lives under packages/ and is developed
# alongside this project. uv resolves it from the workspace member rather
# than a registry. For non-uv installs (e.g., pip on a Lambda layer),
# gri-tile-loaders must be installed separately from a built wheel or index.
[tool.uv.workspace]
members = ["packages/gri-tile-loaders"]

[tool.uv.sources]
gri-tile-loaders = { workspace = true }
gri-shared-library = { git = "https://github.com/wri/gri-shared-library.git", branch = "develop"}
#gri-shared-library = { path = "/home/kennc/github/gri-shared-library"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests taking >10s (deselect with -m 'not slow')",
    "parity: parity comparison against reference",
    "integration: requires AWS/S3 access",
    "tf: requires TensorFlow",
]
addopts = "-v --tb=short -ra"
filterwarnings = ["ignore::DeprecationWarning:tensorflow.*"]
