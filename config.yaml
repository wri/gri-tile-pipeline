pipeline:
  parquet_path: data/tiledb.parquet

# lithops config keys intentionally omitted. Set LITHOPS_ENV (e.g. land-research)
# to resolve .lithops/<env>/config.*.yaml for all four, or override explicitly here.

download:
  runtime: ttc-loaders-dev
  memory_mb: 4096
  retries: 3

predict:
  runtime: ttc-predict-dev
  memory_mb: 6144
  retries: 2
  timeout_sec: 600

zonal:
  tile_bucket: tof-output
  small_sites_area_thresh: 0.5
